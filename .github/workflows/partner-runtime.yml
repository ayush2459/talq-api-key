name: Partner runtime checks

on:
  pull_request:
    branches:
      - feature/isolated-local-onboarding-test-db
  push:
    branches:
      - feature/local-partner-runtime-talq-validator

jobs:
  validator-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install pytest cryptography jsonschema openapi-schema-validator
      - name: Compile partner runtime modules
        run: python -m compileall -q partner_runtime talq_validator
      - name: Run TALQ validator unit tests
        run: python -m pytest -q tests/test_talq_response_validator.py
