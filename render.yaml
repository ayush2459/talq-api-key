services:
  - type: web
    name: flowsense-talq-gateway
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FLOW_SENSE_DATABASE_URL
        sync: false
      - key: TALQ_CLIENT_ADDRESS
        value: ""
      - key: DEMO_MODE
        value: "true"
      - key: API_KEY_LIFETIME_DAYS
        value: "90"
      - key: TELEGRAM_VERIFICATION_MINUTES
        value: "30"
      - key: PUBLIC_BASE_URL
        value: "https://flowsense-talq-gateway.onrender.com"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://flowsense.onrender.com"

  - type: web
    name: flowsense-talq-dashboard
    runtime: static
    plan: free
    buildCommand: ""
    staticPublishPath: ./frontend
    autoDeployTrigger: commit

