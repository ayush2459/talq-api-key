services:
  - type: web
    name: flowsense-talq-gateway
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TALQ_CLIENT_ADDRESS
        value: ""
      - key: DEMO_MODE
        value: "true"
      - key: API_KEY_LIFETIME_DAYS
        value: "90"
      - key: EMAIL_VERIFICATION_MINUTES
        value: "30"
      - key: PUBLIC_BASE_URL
        value: "https://flowsense-talq-gateway.onrender.com"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_STARTTLS
        value: "true"
