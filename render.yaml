services:
  - type: web
    name: flowsense-talq-gateway
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TALQ_CLIENT_ADDRESS
        value: ""
      - key: DEMO_MODE
        value: "true"
